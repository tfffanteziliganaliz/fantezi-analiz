name: Otomatik Fantezi Veri Güncelleyici

on:
  schedule:
    # Her gece saat 03:00'te otomatik çalışır
    - cron: '0 3 * * *'
  workflow_dispatch: # İstediğin zaman manuel tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodları Çek
        uses: actions/checkout@v3

      - name: Python Kur
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Botu Çalıştır
        run: python scraper.py

      - name: Değişiklikleri Kaydet ve Push Et
        run: |
          git config --global user.name 'FanteziBot'
          git config --global user.email 'bot@fantezi.com'
          git add veriler.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Veriler otomatik güncellendi" && git push)
