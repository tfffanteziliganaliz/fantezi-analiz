<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFF Fantezi Analiz Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-sans pb-12">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-400"><i class="fa-solid fa-chart-line mr-2"></i>FanteziAnaliz</h1>
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-1 rounded">CANLI VERİ</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">

        <!-- Kaptan Adayları (TFF Sistemine Özel) -->
        <section>
            <h2 class="text-sm font-semibold text-slate-400 mb-3 flex items-center gap-2">
                <i class="fa-solid fa-crown text-amber-400"></i> HAFTANIN KAPTAN ADAYLARI
            </h2>
            <div id="kaptan-listesi" class="grid grid-cols-2 gap-3">
                <!-- Javascript dolduracak -->
            </div>
        </section>

        <!-- Filtreler -->
        <section class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
            <button onclick="filtrele('Hepsi')" class="bg-emerald-500 text-slate-900 font-bold px-4 py-2 rounded-xl text-sm whitespace-nowrap">Tüm Mevkiler</button>
            <button onclick="filtrele('KL')" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm whitespace-nowrap">Kaleci</button>
            <button onclick="filtrele('DF')" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm whitespace-nowrap">Defans</button>
            <button onclick="filtrele('OS')" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm whitespace-nowrap">Orta Saha</button>
            <button onclick="filtrele('FV')" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-sm whitespace-nowrap">Forvet</button>
        </section>

        <!-- Oyuncu Analiz Listesi -->
        <section>
            <h2 class="text-sm font-semibold text-slate-400 mb-3">OYUNCU MİMARİSİ VE TFF PUAN PROJEKSİYONU</h2>
            <div id="oyuncu-listesi" class="space-y-3">
                <!-- Javascript dolduracak -->
            </div>
        </section>

    </main>

    <script src="app.js"></script>
</body>
</html>
